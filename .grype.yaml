# Temporary acceptance of CVE-2026-7210 in the unpatched upstream Python 3.10.21.
# Remove after adopting an official Python 3.10 image containing the XML hash-salt fix.
# Tracked in https://github.com/wodby/python/issues/10
ignore:
  - vulnerability: CVE-2026-7210
    package:
      name: python
      version: 3.10.21
      type: binary
  # Temporary acceptance until the official Python 3.13 image includes the tarfile fix.
  # https://github.com/python/cpython/pull/157192
  # Remove after upgrading: https://github.com/wodby/python/issues/12
  - vulnerability: CVE-2026-82049
    package:
      name: python
      version: 3.13.15
      type: binary
